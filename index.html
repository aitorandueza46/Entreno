<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progresión · Fuerza / Potencia / Calistenia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-deco" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="bg-grid"></div>
</div>

<header class="app">
  <div class="row">
    <h1>PROGRESIÓN <span>·</span> FUERZA / POTENCIA / CALISTENIA</h1>
    <span class="header-right">
      <span class="badge num" id="mesActualBadge"></span>
    </span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="entrenar">Entrenar</button>
    <button data-tab="rutina">Rutina</button>
    <button data-tab="marca">Marca mensual</button>
    <button data-tab="progresion">Progresión</button>
    <button data-tab="historial">Historial</button>
    <button data-tab="objetivos">Objetivos</button>
    <button data-tab="config">Configuración</button>
  </nav>
</header>

<main>

  <section class="view active" id="view-dashboard"></section>
  <section class="view" id="view-entrenar"></section>
  <section class="view" id="view-rutina"></section>
  <section class="view" id="view-marca"></section>
  <section class="view" id="view-progresion"></section>
  <section class="view" id="view-historial"></section>
  <section class="view" id="view-objetivos"></section>
  <section class="view" id="view-config"></section>

</main>

<footer class="saved">
  <span id="storageStatus">Cargando</span>
  <span>
    <button id="btnExport">Exportar datos (.json)</button> ·
    <button id="btnImport">Importar datos</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none">
  </span>
</footer>

<script type="module">
  /* Carga del driver de Neon para navegador (serverless driver over HTTP).
     Si falla (sin internet o CDN bloqueado), la app sigue funcionando en modo local. */
  (async () => {
    try {
      const m = await import("https://esm.sh/@neondatabase/serverless@1.0.0");
      window.neon = m.neon;
    } catch (e) {
      console.warn("Driver de Neon no disponible (modo local).", e);
    }
    const load = (src) => new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = res;
      s.onerror = () => rej(new Error("No se pudo cargar " + src));
      document.body.appendChild(s);
    });
    try {
      await load("config.js");
    } catch (e) {
      console.warn("config.js no encontrado (sin nube, modo local).", e.message);
    }
    try {
      await load("script.js");
    } catch (e) {
      console.error(e.message);
    }
  })();
</script>
</body>
</html>
